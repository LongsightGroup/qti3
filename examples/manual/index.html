<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qti3 manual harness</title>
    <link id="external-theme" rel="stylesheet" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        color: #151515;
        background: #fafafa;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      main {
        display: grid;
        grid-template-columns: minmax(18rem, 24rem) 1fr;
        min-height: 100vh;
      }

      aside {
        padding: 1rem;
        border-right: 1px solid #d8d8d8;
        background: #fff;
      }

      section {
        padding: 1rem;
      }

      main > * {
        min-width: 0;
      }

      textarea {
        width: 100%;
        min-height: 14rem;
        font: inherit;
      }

      select,
      input,
      button,
      textarea,
      pre {
        max-width: 100%;
      }

      select,
      input,
      textarea,
      pre {
        width: 100%;
      }

      textarea,
      pre {
        overflow-wrap: anywhere;
      }

      pre {
        white-space: pre-wrap;
      }

      qti-assessment-item-player {
        display: block;
        padding: 1rem;
        color: CanvasText;
        background: Canvas;
        border: 1px solid #d8d8d8;
      }

      .qti3-interaction {
        margin-block: 1rem;
      }

      .theme-note {
        margin-block: 0.35rem 1rem;
        color: #555;
        font-size: 0.9rem;
      }

      .score-panel {
        display: grid;
        gap: 0.65rem;
        margin-block: 1rem;
        padding: 0.85rem;
        border: 1px solid #c9c9c9;
        background: #f6f6f3;
      }

      .score-panel h2 {
        margin: 0;
      }

      .score-panel[data-status="scored"] {
        border-color: #2f6f3e;
        background: #edf7ef;
      }

      .score-panel[data-status="blocked"] {
        border-color: #9d5c00;
        background: #fff6e8;
      }

      .score-kpis {
        display: grid;
        gap: 0.5rem;
        grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
        margin: 0;
      }

      .score-kpis div {
        display: grid;
        gap: 0.15rem;
        padding: 0.5rem;
        border: 1px solid #d8d8d8;
        background: #fff;
      }

      .score-kpis dt {
        color: #555;
        font-size: 0.85rem;
      }

      .score-kpis dd {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
      }

      label {
        display: block;
        margin-block: 0.35rem;
      }

      @media (max-width: 48rem) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid #d8d8d8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>qti3 manual harness</h1>
        <label>
          Reference fixture
          <select id="fixture"></select>
        </label>
        <button id="load-fixture" type="button">Load fixture</button>
        <label>
          Harness theme
          <select id="theme"></select>
        </label>
        <p id="theme-note" class="theme-note" aria-live="polite">
          Harness-only CSS. Not bundled with @qti3/player.
        </p>
        <h2>Open local QTI files</h2>
        <input id="file" type="file" accept=".xml,text/xml,application/xml" multiple />
        <label>
          Loaded file
          <select id="local-files"></select>
        </label>
        <button id="previous-file" type="button">Previous</button>
        <button id="next-file" type="button">Next</button>
        <p id="file-summary" aria-live="polite"></p>
        <h2>Paste QTI XML</h2>
        <textarea id="xml" spellcheck="false"></textarea>
        <button id="load-xml" type="button">Load XML</button>
        <div id="score-panel" class="score-panel" data-status="idle" aria-live="polite">
          <h2>Score result</h2>
          <p id="score-status">Not scored yet.</p>
          <dl class="score-kpis">
            <div>
              <dt>SCORE</dt>
              <dd id="score-value">-</dd>
            </div>
            <div>
              <dt>Responses</dt>
              <dd id="response-count">0</dd>
            </div>
            <div>
              <dt>Validation</dt>
              <dd id="validation-count">0</dd>
            </div>
          </dl>
          <details>
            <summary>Responses and outcomes</summary>
            <pre id="score-details">{}</pre>
          </details>
        </div>
        <pre id="events" aria-live="polite"></pre>
      </aside>
      <section>
        <qti-assessment-item-player id="player"></qti-assessment-item-player>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
