packages:
  - "packages/*"
  - "examples/*"

# Security patches for the existing formatter and Vite toolchain.
overrides:
  "tinypool@2.1.0": "2.1.2"
  "source-map-js@1.2.1": "1.2.2"

# Allow this reviewed security patch before the configured seven-day delay.
minimumReleaseAgeExclude:
  - "source-map-js@1.2.2"
