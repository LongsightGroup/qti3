<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared vocabulary gallery | qti3</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f7;
        --panel: #fff;
        --panel-alt: #f9fafb;
        --ink: #111827;
        --muted: #4b5563;
        --line: #d7dce2;
        --accent: #245f9f;
        --accent-bg: #e7f0fb;
        --danger: #9f2f2f;
        --success: #23643a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font:
          14px/1.5 system-ui,
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-block-size: 2.25rem;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 2px;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(17rem, 21rem) minmax(0, 1fr) minmax(20rem, 28rem);
        min-block-size: 100vh;
      }

      .sidebar,
      .inspector {
        min-inline-size: 0;
        background: var(--panel);
      }

      .sidebar {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        border-inline-end: 1px solid var(--line);
      }

      .inspector {
        border-inline-start: 1px solid var(--line);
        overflow: auto;
      }

      header,
      .filters,
      .case-list,
      .main,
      .inspector-section {
        padding: 1rem;
      }

      header {
        border-block-end: 1px solid var(--line);
      }

      h1,
      h2,
      h3,
      p {
        margin-block: 0;
      }

      h1 {
        font-size: 1.2rem;
        line-height: 1.25;
      }

      h2 {
        font-size: 1rem;
      }

      h3 {
        font-size: 0.92rem;
      }

      .subtle {
        color: var(--muted);
      }

      .filters {
        display: grid;
        gap: 0.75rem;
        border-block-end: 1px solid var(--line);
      }

      label {
        display: grid;
        gap: 0.25rem;
        color: var(--muted);
      }

      select,
      input {
        inline-size: 100%;
        min-block-size: 2.25rem;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
      }

      .case-list {
        display: grid;
        align-content: start;
        gap: 0.35rem;
        overflow: auto;
      }

      .case-button {
        display: grid;
        gap: 0.2rem;
        inline-size: 100%;
        padding: 0.55rem 0.65rem;
        text-align: start;
      }

      .case-button[aria-current="true"] {
        border-color: var(--accent);
        background: var(--accent-bg);
      }

      .case-meta {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .main {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 1rem;
        min-inline-size: 0;
        overflow: auto;
      }

      .case-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
      }

      .tag {
        padding: 0.1rem 0.45rem;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--muted);
        font-size: 0.82rem;
      }

      qti-assessment-item-player {
        display: block;
        min-block-size: 24rem;
        padding: 1rem;
        border: 1px solid var(--line);
        background: Canvas;
        color: CanvasText;
      }

      .inspector-section {
        display: grid;
        gap: 0.75rem;
        border-block-end: 1px solid var(--line);
      }

      .actions {
        display: grid;
        gap: 0.5rem;
        grid-template-columns: 1fr 1fr;
      }

      .classes,
      .assertions {
        display: grid;
        gap: 0.5rem;
      }

      .class-row,
      .assertion-row {
        display: grid;
        gap: 0.25rem;
        padding: 0.55rem;
        border: 1px solid var(--line);
        background: var(--panel-alt);
      }

      code {
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.85em;
      }

      .status {
        font-weight: 700;
      }

      .status-pass {
        color: var(--success);
      }

      .status-fail {
        color: var(--danger);
      }

      .status-skip {
        color: var(--muted);
      }

      .empty-state {
        padding: 1rem;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--muted);
      }

      @media (max-width: 72rem) {
        .shell {
          grid-template-columns: 18rem minmax(0, 1fr);
        }

        .inspector {
          grid-column: 1 / -1;
          border-inline-start: 0;
          border-block-start: 1px solid var(--line);
        }
      }

      @media (max-width: 48rem) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-inline-end: 0;
          border-block-end: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <header>
          <h1>Shared Vocabulary Gallery</h1>
          <p class="subtle">Matrix fixtures for visual QA.</p>
        </header>
        <search class="filters" aria-label="Gallery filters">
          <label>
            Interaction type
            <select id="interaction-filter"></select>
          </label>
          <label>
            Class family
            <select id="family-filter"></select>
          </label>
          <label>
            Support level
            <select id="support-filter"></select>
          </label>
          <label>
            Case search
            <input id="case-search" type="search" autocomplete="off" />
          </label>
        </search>
        <nav class="case-list" id="case-list" aria-label="Shared vocabulary matrix cases"></nav>
      </aside>

      <main class="main">
        <section class="case-heading" aria-labelledby="case-title">
          <div>
            <h2 id="case-title">Loading</h2>
            <p id="case-description" class="subtle"></p>
          </div>
          <div class="tag-row" id="case-tags" aria-label="Selected case metadata"></div>
        </section>
        <qti-assessment-item-player id="player"></qti-assessment-item-player>
      </main>

      <aside class="inspector" aria-label="Selected case inspector">
        <section class="inspector-section">
          <h2>Inspector</h2>
          <div class="actions">
            <button id="copy-xml" type="button">Copy item XML</button>
            <button id="copy-test" type="button">Copy test name</button>
          </div>
          <p id="copy-status" class="subtle" aria-live="polite"></p>
        </section>
        <section class="inspector-section">
          <h3>Classes</h3>
          <div class="classes" id="class-inspector"></div>
        </section>
        <section class="inspector-section">
          <h3>Manifest Assertions</h3>
          <div class="assertions" id="assertion-list"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="./sv-gallery.ts"></script>
  </body>
</html>
