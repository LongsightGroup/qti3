name: Private certification evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification:
    # Provision this protected environment and dedicated runner before dispatch.
    # The runner owns member-authorized content and private evidence storage.
    environment: qti-certification
    runs-on: [self-hosted, qti-certification]
    env:
      QTI3_EXTERNAL_QTI_DIR: ${{ vars.QTI3_EXTERNAL_QTI_DIR }}
      QTI3_CERTIFICATION_OUTPUT_DIR: ${{ runner.temp }}/qti3-certification-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run certification gate with private logs
        shell: bash
        run: |
          test -n "$QTI3_EXTERNAL_QTI_DIR"
          test -d "$QTI3_EXTERNAL_QTI_DIR"
          umask 077
          mkdir -p "$QTI3_CERTIFICATION_OUTPUT_DIR"
          pnpm certification:check > "$QTI3_CERTIFICATION_OUTPUT_DIR/gate.log" 2>&1
      - name: Retain evidence privately
        if: always()
        shell: bash
        run: |
          echo 'Certification logs and reports remain on the dedicated runner; inspect its private evidence directory.' >> "$GITHUB_STEP_SUMMARY"
    # Do not upload member content, raw reports, or failing assertion output to
    # publicly downloadable Actions artifacts. The runner owner archives them.
