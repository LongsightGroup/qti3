name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'LongsightGroup/qti3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:check
      - run: |
          mkdir -p .release
          pnpm --dir packages/core pack --pack-destination ../../.release
          pnpm --dir packages/fixtures pack --pack-destination ../../.release
          pnpm --dir packages/a11y pack --pack-destination ../../.release
          pnpm --dir packages/conformance pack --pack-destination ../../.release
          pnpm --dir packages/player pack --pack-destination ../../.release
          pnpm --dir packages/player-preact pack --pack-destination ../../.release
          pnpm --dir packages/player-react pack --pack-destination ../../.release
          pnpm --dir packages/pnp pack --pack-destination ../../.release
          pnpm --dir packages/writer pack --pack-destination ../../.release
          pnpm --dir packages/migrator pack --pack-destination ../../.release
          pnpm --dir packages/transcoder pack --pack-destination ../../.release
          pnpm --dir packages/cli pack --pack-destination ../../.release
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          publish_package() {
            PACKAGE_NAME="$1"
            TARBALL="$2"
            if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${PACKAGE_NAME}@${VERSION}; already published."
              return 0
            fi
            npm publish "${TARBALL}" --access public
          }

          publish_package "@longsightgroup/qti3-core" ".release/longsightgroup-qti3-core-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-fixtures" ".release/longsightgroup-qti3-fixtures-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-a11y" ".release/longsightgroup-qti3-a11y-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-conformance" ".release/longsightgroup-qti3-conformance-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-player" ".release/longsightgroup-qti3-player-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-player-preact" ".release/longsightgroup-qti3-player-preact-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-player-react" ".release/longsightgroup-qti3-player-react-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-pnp" ".release/longsightgroup-qti3-pnp-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-writer" ".release/longsightgroup-qti3-writer-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-migrator" ".release/longsightgroup-qti3-migrator-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-transcoder" ".release/longsightgroup-qti3-transcoder-${VERSION}.tgz"
          publish_package "@longsightgroup/qti3-cli" ".release/longsightgroup-qti3-cli-${VERSION}.tgz"
