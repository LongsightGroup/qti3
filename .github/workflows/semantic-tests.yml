name: Extended semantic tests

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enumerate longer sequences and additional presentation seeds
        run: pnpm test:semantic --reporter=json --outputFile=semantic-tests.json
        env:
          QTI3_EXTENDED_SEMANTICS: "1"
      - name: Verify detection of curated semantic faults
        if: success() || failure()
        run: pnpm check:semantic-mutations semantic-mutations.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-evidence
          path: |
            semantic-tests.json
            semantic-mutations.json
          if-no-files-found: error
          retention-days: 14
